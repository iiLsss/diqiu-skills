<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动知识讲解</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/review.css"><script type="module" src="/app.js"></script></head><body><main>
<header><span class="eyebrow">互动知识讲解 / 动手试一试</span><h1 data-lesson-title></h1><p data-body="intro"></p><button data-review="intro">批注开场</button></header>
<section><div class="section-head"><h2 data-title="experiment"></h2><button data-review="experiment">批注实验</button></div><p data-body="experiment"></p>
<div class="controls"><label>路程 <output id="distance-output"></output><input id="distance" aria-label="路程（米）" type="range" min="60" max="240" step="10" value="120"></label><label>B 的速度 <output id="speed-output"></output><input id="speed" aria-label="速度（米每秒）" type="range" min="1" max="3" step="0.5" value="2"></label></div>
<div class="comparison"><article><h3>A · 速度固定 1 米/秒</h3><div class="track"><div class="bar baseline"></div></div><p id="baseline-result"></p></article><article><h3>B · 由你调整速度</h3><div class="track" data-review="experiment" data-review-anchor="result" role="button" tabindex="0" aria-label="批注比较结果"><div class="bar" id="time-bar"></div></div><p id="result"></p></article></div><p class="hint">条形长度表示走完全程所需时间，以 A 为对照；不是路线长度。</p><button id="reset">重置实验</button></section>
<section><div class="section-head"><h2 data-title="why"></h2><button data-review="why">批注原理</button></div><p data-body="why"></p></section>
<section><div class="section-head"><h2 data-title="challenge"></h2><button data-review="challenge">批注预测</button></div><p data-body="challenge"></p><div class="answers"><button data-answer="half" aria-pressed="false">需要一半时间</button><button data-answer="same" aria-pressed="false">时间一样</button><button data-answer="double" aria-pressed="false">需要两倍时间</button></div><p id="prediction-status" role="status">先选一个答案，再验证。</p><button id="verify" disabled>用实验验证</button><p id="feedback" hidden></p></section>
<section><div class="section-head"><h2 data-title="limits"></h2><button data-review="limits">批注条件</button></div><p data-body="limits"></p></section><p id="connection-error" role="alert" hidden></p>
</main></body></html>
